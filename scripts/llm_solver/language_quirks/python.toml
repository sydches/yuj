# Language descriptor: Python environment and package recovery

name = "python"
description = "Python environment and package recovery advice"

[advice]
python_runner_missing = "\n[HARNESS: Python or the requested Python runner could not start in the current environment. Use the project's existing Python environment or runner if available, such as a virtual environment, Conda, uv, tox, or nox, then retry. Inspect the project before creating an environment or installing packages.]"
# A missing import alone does not identify its cause or permit environment changes.
python_env_missing = "\n[HARNESS: this Python interpreter cannot import `{module}`. Check the command and module path first: this may be a wrong test label, an optional dependency, or a required package. Check the project's declared requirements and follow task restrictions. Install packages or switch interpreters only if allowed and needed.]"
python_install_failure = "\n[HARNESS: Python package installation failed. Check the reported cause and the project's dependency files. Use the project's existing environment or package tool if available, such as pip, uv, Conda, Poetry, or PDM. If network access is unavailable, prefer installed packages or a local cache instead of repeating the same network install.]"
