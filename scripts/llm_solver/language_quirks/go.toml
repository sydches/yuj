# Task format descriptor: Go
#
# Matches `go test`, `go build`, `go vet` — any go subcommand that
# produces a pass/fail verdict on task correctness.

name = "go"
non_execution_flags = ["--help", "-h", "-n", "-list"]
non_test_check_flags = ["-c"]
description = "Go test/build/vet invocations"
verification_patterns = [
    '''(?:^|[\s/'"])go\s+(?:test|build|vet)\b''',
]

[[detection]]
path = "go.mod"
format = "text"
pattern = '(?m)^\s*module\s+\S+'

[runtime]
language = "Go"
executables = ["go"]
probe_args = ["version"]
command_args = ["test"]
environment = {GOTOOLCHAIN = "local"}

[output_control]
failure_only_flag = "-v"
passed_marker = "--- PASS"
failed_marker = "--- FAIL"

# Structured output parsing for go test. Go's default output has no
# "N passed, M failed" summary line — only per-test `--- PASS: TestX`
# or `--- FAIL: TestX` markers, plus a terminal `PASS` / `FAIL` and
# `ok <pkg> <time>` / `FAIL <pkg> <reason>`. Summary counts are
# derived implicitly by the parser from per_test matches when the
# summary block is empty; consumers see the counts via
# len(parsed["tests"]).

[output_parser.per_test]
# --- PASS: TestFoo/subtest (0.01s)
# --- FAIL: TestBar (0.02s)
# This descriptor maps Go's words to the shared internal states.
verdict_map = { PASS = "PASSED", FAIL = "FAILED" }
regex = '''^---\s+(?P<verdict>PASS|FAIL)(?:\s*:\s*)(?P<test_id>\S+)'''

# How run_tests should invoke this runner when the repo is detected as
# Go (go.mod present in cwd). go test ships with the toolchain; no env
# activation needed.
[run_tests]
detection_priority = 2
env_activate_prefix = ""
base_cmd = "go test"
detect_files = ["go.mod", "go.sum"]
# Go takes a package path positionally and -run for the name regex filter.
# Without a path, Go checks the current package.
arg_path_style = "positional"
arg_path_prefix = "./"
arg_k_template = "-run {expr}"
arg_last_failed = ""              # no built-in equivalent
component_test_names = ["{stem}_test.go"]
component_target_template = "./{test_parent}"
component_fallback = "none"

# `go test`/`go vet`/`go build` don't have pytest's rich exit-code
# vocabulary — it's just 0 (ok) vs nonzero (build failure, vet finding,
# or test failure, all folded into exit 1). Keep it simple: nonzero is
# always "failed", never pytest's "collection_error"/"usage_error"/
# "no_tests_collected" because those labels do not apply to Go.
status_default = "failed"

[run_tests.status_map]
0 = "passed"

# Requested CLI grammar only; it does not establish execution or coverage.

[[diagnostic_invocations]]
family = "go"
prefix = ["go", "test"]
flags = ["-v", "-race", "-short", "-failfast", "-json"]
value_options = ["-run", "-bench", "-timeout", "-count", "-parallel", "-p", "-coverprofile", "-list"]
