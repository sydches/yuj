# Task format descriptor: pytest-family Python testing
#
# Matches: pytest, py.test, unittest invocations, either directly or via
# `python[N] -m pytest/unittest`. Does NOT match bare `cat test_foo.py`
# or file reads — only actual runner invocations.
#
# Analysis tools that accept --task-format load this file and use its
# patterns as the definition of "verification command" for the run.

name = "pytest"
description = "pytest / py.test / unittest / python -m pytest invocations"
non_execution_flags = ["--help", "-h", "--version", "--collect-only", "--co"]
verification_patterns = [
    '''(?:^|[\s/'"])(?:pytest|py\.test|unittest)\b''',
    '''(?:^|[\s/'"])python[0-9.]*\s+(?:-m\s+)?(?:pytest|unittest)\b''',
    '''(?:^|[\s/'"])python[0-9.]*\s+['"]?(?:[^\s;|&]+/)?run_?tests\.py['"]?(?:\s|$)''',
    '''(?:^|[\s/'"])(?:python[0-9.]*\s+)?(?:[^\s;|&]+/)?manage\.py\s+test\b''',
    '''(?:^|[\s/'"])(?:tox|nox)\b''',
]

[[detection]]
path = "pyproject.toml"
format = "toml"
section = ["tool", "pytest", "ini_options"]

[[detection]]
path = "pytest.ini"
format = "ini"
section = ["pytest"]

[[detection]]
path = "setup.cfg"
format = "ini"
section = ["tool:pytest"]

[[detection]]
path = "tox.ini"
format = "ini"
section = ["pytest"]

[[detection]]
path = "conftest.py"
format = "presence"

[runtime]
language = "Python"
executables = ["python3", "python"]
environment_executable = "bin/python"
environment_markers = ["pyvenv.cfg", "conda-meta/history"]
probe_format = "json"
command_path_from_runtime = "executable"
project_arguments = ["pyproject.toml:project.requires-python"]
probe_args = ["-I", "-c", '''
import json, sys
result = dict(executable=sys.executable, prefix=sys.prefix, version=sys.version.split()[0], available=False, compatible=False)
try:
    import pytest
    result['available'] = True
    result['runner_version'] = pytest.__version__
    if not sys.argv[1]:
        result['compatible'] = True
    else:
        from packaging.specifiers import SpecifierSet
        result['compatible'] = SpecifierSet(sys.argv[1]).contains(result['version'])
except (ImportError, ValueError):
    pass
print(json.dumps(result))
''']
command_args = ["-m", "pytest", "--tb=short", "-q", "--no-header"]

# Flags appended to test commands by the harness to reduce output volume.
# Only appended if not already present in the command.
[output_control]
failure_only_flag = "--tb=short -q --no-header"
# Only pytest accepts this flag set. unittest remains a verification command.
command_patterns = ['''^(?:\S*/)?(?:pytest|py\.test)\b''', '''^(?:\S*/)?python[0-9.]*\s+-m\s+pytest\b''']
# Routine runs suppress progress, uncaptured prints, and extra report sections.
# A bash call with output_detail="full" preserves explicitly requested flags.
quiet_flags = ["-v", "-q", "-s", "-r*", "--verbose", "--quiet", "--capture=no"]
# Preserve stop-on-first-failure when it appears in a bundle such as -xvs.
preserve_short_flags = "x"
# These options own the following word; never treat that word as an output flag.
argument_flags = ["-k", "-m", "-c", "-o", "-p", "--override-ini", "--rootdir", "--confcutdir", "--deselect", "--ignore", "--ignore-glob", "--basetemp"]
passed_marker = "PASSED"       # substring in passing-test lines (stripped from output)
failed_marker = "FAILED"       # substring in failing-test lines (never stripped)

# Structured parsing of pytest output. Consumed by bash_quirks.parse_structured()
# for per-subtest regression detection. When
# bash_transforms_structured_output_enabled is set, the harness REPLACES the
# raw result shown to the model with a compact digest rendered from the
# fields below; when the sink mechanism is on (bash_transforms_sink_threshold_chars),
# raw output is also written to .tool_output/<session>_<turn>.log so the
# model can read the full output on demand via the read tool.
[output_parser]
# One regex per summary field — order-agnostic (pytest emits
# "2 failed, 8 passed" or "8 passed, 2 failed" depending on config).
# Each field's first capture group is the integer count.
[output_parser.summary]
passed = '''(\d+)\s+passed'''
failed = '''(\d+)\s+failed'''
errors = '''(\d+)\s+error(?:s|ed)?'''
skipped = '''(\d+)\s+skipped'''

# Per-test verdict lines in pytest -v / --tb=short / -rA outputs:
#   "PASSED tests/test_x.py::test_y"
#   "FAILED tests/test_x.py::test_y - AssertionError: ..."
#   "ERROR tests/test_x.py::test_y"
[output_parser.per_test]
verdict_map = { PASSED = "PASSED", FAILED = "FAILED", ERROR = "ERROR" }
regex = '''
    ^(?P<verdict>PASSED|FAILED|ERROR)\s+(?P<test_id>\S+)
'''

# How the model-callable run_tests tool should invoke this runner.
# Loaded by language_quirks.load_run_tests_quirk(cwd) when the cwd has
# any of the detect_files; consumed by harness/tools.py:run_tests.
[run_tests]
detection_priority = 0
# Startup observes installed project environments before selecting the
# interpreter. Explicit runner requests without startup use the current PATH.
env_activate_prefix = ""
base_cmd = "python3 -m pytest --tb=short -q --no-header"
detect_files = ["pyproject.toml", "setup.py", "setup.cfg", "pytest.ini", "conftest.py", "tox.ini"]
arg_path_style = "positional"      # appended after flags
arg_k_template = "-k {expr}"
arg_last_failed = "--lf"
component_test_names = ["test_{stem}{suffix}", "{stem}_test{suffix}"]
component_target_template = "{test_path}"
component_fallback = "none"
component_collection_plugin = "pytest_component.py"

[run_tests.native_report]
format = "junit"
collection_plugin = "pytest_report.py"
environment = "PYTEST_ADDOPTS"
argument = "--junitxml={path}"
completed_exit_codes = [0, 1]

# pytest exit-code semantics (docs.pytest.org/en/stable/reference/exit-codes.html).
# Encoded explicitly here (rather than relying solely on run_tests.py's
# hardcoded fallback) so the mapping lives with the runner it describes,
# same as every other language_quirks TOML. Values are byte-identical to
# the historical _PYTEST_STATUS map in harness/_tools/_pytest_hints.py.
[run_tests.status_map]
0 = "passed"
1 = "failed"
2 = "collection_error"
3 = "internal_error"
4 = "usage_error"
5 = "no_tests_collected"

[advice]
pytest_path_missing = "\n[HARNESS: The output contains a pytest missing-path message. Compare the requested path with the observed task layout before changing files or retrying. The message alone does not establish which path is absent.]"
pytest_lf_cache_empty = "\n[HARNESS: last_failed=true requires a prior run to populate the lastfailed cache; pytest collected no tests because the cache is empty (no previously-failing tests on record). Run run_tests once without last_failed to populate the cache, then re-issue with last_failed=true. If you intended to verify against the full suite, drop last_failed.]"

# Requested CLI grammar only; it does not establish execution or coverage.

[[diagnostic_invocations]]
family = "pytest"
literal_targets_after_separator = true
prefix = ["pytest|py\\.test"]
flags = ["-q", "-v", "-vv", "-x", "-s", "--lf", "--help", "--version", "--collect-only"]
value_options = ["-k", "-m", "-c", "-o", "--override-ini", "--tb", "--maxfail", "--ignore", "--deselect"]

[[diagnostic_invocations]]
family = "pytest"
literal_targets_after_separator = true
prefix = ["python[0-9.]*", "-m", "pytest"]
flags = ["-q", "-v", "-vv", "-x", "-s", "--lf", "--help", "--version", "--collect-only"]
value_options = ["-k", "-m", "-c", "-o", "--override-ini", "--tb", "--maxfail", "--ignore", "--deselect"]

[[diagnostic_invocations]]
family = "unittest"
prefix = ["python[0-9.]*", "-m", "unittest"]
flags = ["-q", "-v", "-b", "-f", "-c"]
value_options = ["-k", "-s", "-p", "-t"]
non_targets = ["discover"]

[[diagnostic_invocations]]
family = "unittest"
prefix = ["unittest"]
flags = ["-q", "-v", "-b", "-f", "-c"]
value_options = ["-k", "-s", "-p", "-t"]
non_targets = ["discover"]

[[diagnostic_invocations]]
family = "tox"
prefix = ["tox"]
flags = ["-q", "-v", "--help", "--version"]
value_options = ["-e", "-c"]

[[diagnostic_invocations]]
family = "nox"
prefix = ["nox"]
flags = ["-q", "-v", "--help", "--version"]
value_options = ["-s", "-f"]
