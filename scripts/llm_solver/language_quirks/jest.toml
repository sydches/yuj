# Task format descriptor: JavaScript/TypeScript jest/mocha/vitest
#
# Matches the common JS test runners, either as standalone binaries or
# via npm/yarn/pnpm script invocations.

name = "jest"
non_execution_flags = ["--help", "-h", "--version", "--listTests", "--showConfig"]
description = "jest / mocha / vitest / npm test invocations"
verification_patterns = [
    '''(?:^|[\s/'"])(?:jest|mocha|vitest)\b''',
    '''(?:^|[\s/'"])(?:npm|yarn|pnpm)\s+(?:run\s+)?test\b''',
    '''(?:^|[\s/'"])npx\s+(?:--no-install\s+)?(?:jest|mocha|vitest)\b''',
]

[[detection]]
path = "package.json"
format = "json"
section = ["jest"]
exclude_field = ["scripts", "test"]

[runtime]
executables = ["npx"]
probe_args = ["--no-install", "jest", "--version"]
command_args = ["--no-install", "jest", "--reporters=default"]

[output_control]
failure_only_flag = ""
passed_marker = "✓"
failed_marker = "✕"

# Structured output parsing for jest/mocha/vitest. Jest's default reporter
# emits "Tests: N failed, M passed, X total"; per-test lines prefixed by
# ✓ or ✕ on the default reporter, "PASS"/"FAIL" on CI-style reporters.
[output_parser.summary]
passed = '''(\d+)\s+passed'''
failed = '''(\d+)\s+failed'''
skipped = '''(\d+)\s+skipped'''

[output_parser.per_test]
# Map default and CI reporter words to shared internal states.
verdict_map = { "✓" = "PASSED", "✕" = "FAILED", PASS = "PASSED", FAIL = "FAILED" }
regex = '''^\s*(?P<verdict>✓|✕|PASS|FAIL)\s+(?P<test_id>\S[^\(]*?)(?:\s+\(\d+\s*ms\))?$'''

# How run_tests should invoke this runner when the repo is detected as
# an explicit Jest configuration without a declared package test script.
# `npx --no-install` avoids pulling Jest from the network. Declared package
# scripts use their own descriptor and retain their chosen runner and hooks.
[run_tests]
detection_priority = 3
env_activate_prefix = ""
base_cmd = "npx --no-install jest --reporters=default"
detect_files = ["package.json"]
arg_path_style = "positional"
arg_k_template = "-t {expr}"      # jest -t matches test-name patterns
arg_last_failed = "--onlyFailures"
component_test_names = [
    "{stem}.test{suffix}",
    "{stem}.spec{suffix}",
    "test_{stem}{suffix}",
]
component_target_template = "{test_path}"
component_fallback = "none"

# jest/mocha/vitest all use 0=pass, 1=some-tests-failed (or a config/
# runtime error) as their exit-code contract; none of them share
# pytest's 2/3/4/5 vocabulary. Mapping exit 1 straight to "failed"
# instead of pytest's "collection_error" avoids mislabeling a normal
# jest test failure.
status_default = "failed"

[run_tests.status_map]
0 = "passed"
1 = "failed"

# Requested CLI grammar only; it does not establish execution or coverage.

[[diagnostic_invocations]]
family = "jest"
prefix = ["jest"]
flags = ["--runInBand", "--watch", "--help", "--version"]
value_options = ["-t", "--testNamePattern", "--config", "--maxWorkers"]

[[diagnostic_invocations]]
family = "jest"
prefix = ["npx", "jest"]
flags = ["--runInBand", "--watch", "--help", "--version"]
value_options = ["-t", "--testNamePattern", "--config", "--maxWorkers"]

[[diagnostic_invocations]]
family = "jest"
prefix = ["npx", "--no-install", "jest"]
flags = ["--runInBand", "--watch", "--help", "--version"]
value_options = ["-t", "--testNamePattern", "--config", "--maxWorkers"]

[[diagnostic_invocations]]
family = "vitest"
prefix = ["vitest", "run"]
flags = ["--help", "--version"]
value_options = ["-t", "--testNamePattern", "--config"]
