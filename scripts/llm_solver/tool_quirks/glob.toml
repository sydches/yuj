# tool_quirks/glob.toml — guards applied to broad glob_files() results.
#
# Two rules, both data-driven and independently toggleable via knobs:
#
# 1. unscoped_recursive_refuse — when pattern starts with "**/" AND path is
#    "." (whole-repo recursive), return a bounded page plus a hint requesting
#    a path scope. The legacy knob name remains stable.
#
# 2. max_listed_paths_cap — when the resolved match total exceeds the
#    configured ceiling, return a bounded page plus a hint instead of an empty
#    result. Pagination remains available for later pages.
#
# The hint string the model sees on a guarded page:
[refusal_hints]
unscoped_recursive = "unscoped recursive glob; showing a bounded page; provide a path scope (e.g. src/) or narrow the pattern."
too_broad          = "pattern too broad; showing a bounded page; narrow the scope or continue with page=2+."
