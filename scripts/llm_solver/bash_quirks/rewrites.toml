# bash_rewrites.toml — Command rewrite rules for noisy bash patterns.
#
# Each [[rewrite]] entry matches an invoked command and appends a flag
# that reduces presentation noise without changing command exit behavior.
# The harness applies these BEFORE execution.
#
# Rules:
#   pattern:  regex matched at the executable position (re.IGNORECASE)
#   flag:     appended to the matching command fragment
#   skip_if:  don't append if this substring is already in that fragment
#
# These are universal — not benchmark-specific. They apply to any run.

[[rewrite]]
name = "pip_install"
pattern = '''(?:^|[\s'"])pip[0-9]?\s+install\b'''
flag = "-q"
skip_if = ["-q", "--quiet"]

[[rewrite]]
name = "pip_module_install"
pattern = '''python[0-9]?\s+-m\s+pip\s+install\b'''
flag = "-q"
skip_if = ["-q", "--quiet"]

[[rewrite]]
name = "npm_install"
pattern = '''(?:^|[\s'"])npm\s+install\b'''
flag = "--loglevel=error"
skip_if = ["--loglevel", "--silent", "-s"]

[[rewrite]]
name = "yarn_install"
pattern = '''(?:^|[\s'"])yarn\s+(?:install|add)\b'''
flag = "--silent"
skip_if = ["--silent", "-s"]

[[rewrite]]
name = "make_build"
pattern = '''(?:^|[\s'"])make\b(?!\s+test)(?!\s+check)'''
flag = "-s"
skip_if = ["-s", "--silent"]

# ── TypeScript/Node build-check runners ────────────────────────────
# ``--pretty false`` removes colorized code frames while preserving tsc's
# diagnostics and exit status. Watch-mode commands are left alone.
[[rewrite]]
name = "npx_tsc_check"
pattern = '''(?:^|[\s/'"])npx\s+(?:-\S+\s+)*tsc\b'''
flag = "--pretty false"
skip_if = ["--pretty", "--watch", " -w"]

[[rewrite]]
name = "tsc_check"
pattern = '''(?:^|[\s/'"])tsc\b'''
flag = "--pretty false"
skip_if = ["--pretty", "--watch", " -w"]
