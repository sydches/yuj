# Run Qwen3.6-35B-A3B with all layers on the GPU and MTP enabled.
# Use a llama-server build that supports MTP.
# Put the MTP GGUF at model_path.
# Keep max_num_seqs at 1 and do not use a vision projection.

schema_version = 1

[model]
name = "qwen3.6-35b-a3b"
profile_name = "qwen3.6-35b-a3b"
context_size = 49152
tokenizer_id = "Qwen/Qwen3.6-35B-A3B"

[launch]
runtime = "llama_server"
model_path = "~/models/gguf/mtp/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
served_name = "qwen3.6-35b-a3b"
host = "127.0.0.1"
port = 8080
max_model_len = 49152
max_num_seqs = 1                                 # MTP requires parallel==1
chat_template_path = "profiles/qwen3.6-35b-a3b/chat_template_meanderix.jinja"

[launch.sampling]
temperature = 0
top_k = 1
top_p = 1
min_p = 0
presence_penalty = 0
repetition_penalty = 1.05
seed = 42

[launch.llama_server]
# The default llama-server binary must support MTP.
spec_type = "draft-mtp"
spec_draft_n_max = 2
# Keep all experts on the GPU.
n_cpu_moe = 0
cpu_mask = "0x00FF"
cpu_strict = true
threads = 8
prio = 2
n_gpu_layers = 99
flash_attn = true
cache_type_k = "q8_0"
cache_type_v = "q8_0"
jinja = true
no_context_shift = true
batch = 2048
ubatch = 1024
mmap = true
n_predict = 16384
