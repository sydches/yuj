# Model-visible transformation switches.
#
# true means enabled. A conditional transformation may still have no reason
# to fire during a run.
#
# True control:
#   All eight are false.
#
# Current paper control:
#   output_cleanup_and_normalization = true
#   All other transformations are false.
#
# Current paper treatment:
#   All eight are true.

[transformations]
output_cleanup_and_normalization = false # Return raw tool output.
command_rewrites = false # Run model commands without automatic rewrites.
task_format_command_output_handling = false # Keep task-runner output unstructured.
forbidden_command_replacement = false # Do not replace unsafe command forms.
preflight_reclip = false # Do not re-clip context before a model turn.
halflife_context = false # Use the full-history context strategy.
detector_and_interventions = false # Disable the behavior detector and its advice.
detector_activated_guardrails = false # Disable guardrails armed by detector state.
