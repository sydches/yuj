# Model-visible transformation switches.
#
# true means enabled. A conditional transformation may still have no reason
# to fire during a run.
#
# True control:
#   All eight are false.
#
# Current paper control:
#   output_cleanup_and_normalization = true
#   All other transformations are false.
#
# Current paper treatment:
#   All eight are true.

[transformations]
output_cleanup_and_normalization = true # Clean and bound model-visible tool output.
command_rewrites = true # Apply registered command rewrites before execution.
task_format_command_output_handling = true # Structure recognized task-runner output.
forbidden_command_replacement = true # Replace registered unsafe command forms.
preflight_reclip = true # Re-clip context before a model turn when needed.
halflife_context = true # Use the half-life context strategy.
detector_and_interventions = true # Enable the behavior detector and its advice.
detector_activated_guardrails = true # Allow detector state to arm guardrails.
