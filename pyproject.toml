[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuj"
version = "0.1.0"
description = "Yuj is a coding-agent harness that watches the LLM and keeps it on course. It maintains relevant context without extra LLM calls."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "openai",
    "orjson",
    "PyYAML>=6.0",
    "requests",
    "transformers",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.12.5",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
]

[project.scripts]
yuj = "scripts.llm_assist.__main__:main"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.setuptools.packages.find]
include = ["scripts", "scripts.llm_assist*", "scripts.llm_solver*"]
exclude = ["scripts.serve*"]

[tool.setuptools.package-data]
"scripts.llm_solver.bash_quirks" = ["*.toml"]
"scripts.llm_solver.language_quirks" = ["*.toml"]
"scripts.llm_solver.tool_quirks" = ["*.toml"]
