# Tool schemas — parameter shapes are invariant across description modes.
#
# Mode-specific prose lives in profiles/_base/tool_descriptions/<mode>/<tool>.txt
# and is injected at load time by scripts/llm_solver/harness/schemas.py.
#
# To change an existing input shape, update its [[tools]] entry and its Python
# handler and tests. A new tool also needs registry and dispatch code. To add a
# new description mode, create a directory under tool_descriptions/ with one
# .txt file per tool name.

[[tools]]
name = "bash"
required = ["cmd"]
properties = { cmd = { type = "string" }, background = { type = "boolean" } }

[[tools]]
name = "bash_poll"
required = ["proc_id"]
properties = { proc_id = { type = "string" }, timeout_s = { type = "number" } }

[[tools]]
name = "bash_kill"
required = ["proc_id"]
properties = { proc_id = { type = "string" } }

[[tools]]
name = "read"
required = ["path"]
properties = { path = { type = "string" }, offset = { type = "integer" }, limit = { type = "integer" } }

[[tools]]
name = "write"
required = ["path", "content"]
properties = { path = { type = "string" }, content = { type = "string" } }

[[tools]]
name = "edit"
required = ["path", "old_str", "new_str"]
properties = { path = { type = "string" }, old_str = { type = "string" }, new_str = { type = "string" } }

[[tools]]
name = "glob"
required = ["pattern"]
properties = { pattern = { type = "string" }, path = { type = "string" }, page = { type = "integer" } }

[[tools]]
name = "grep"
required = ["pattern"]
properties = { pattern = { type = "string" }, path = { type = "string" }, glob = { type = "string" }, page = { type = "integer" } }

[[tools]]
name = "write_todos"
required = ["todos"]
properties = { todos = { type = "array", items = { type = "object", required = ["description", "status"], additionalProperties = false, properties = { description = { type = "string" }, status = { type = "string", enum = ["pending", "in_progress", "completed", "cancelled", "blocked"] } } } } }

[[tools]]
name = "checkpoint"
required = ["goal"]
properties = { goal = { type = "string" } }

[[tools]]
name = "rewind"
required = ["report"]
properties = { report = { type = "string" } }

[[tools]]
name = "run_tests"
required = []
properties = { path = { type = "string" }, k = { type = "string" }, last_failed = { type = "boolean" } }

[[tools]]
name = "list_definitions"
required = ["path"]
properties = { path = { type = "string" }, symbol = { type = "string" }, kind = { type = "string", enum = ["def", "ref"] }, repo_wide = { type = "boolean" }, page = { type = "integer" } }

[[tools]]
name = "apply_patch"
required = ["patch"]
properties = { patch = { type = "string" } }

[[tools]]
name = "udiff"
required = ["patch"]
properties = { patch = { type = "string" } }

[[tools]]
name = "lsp"
required = ["kind", "path"]
properties = { kind = { type = "string", enum = ["definition", "references", "symbols"] }, path = { type = "string" }, line = { type = "integer" }, character = { type = "integer" } }

[[tools]]
name = "exit_plan_mode"
required = []
properties = {}

[[tools]]
name = "think"
required = ["thought"]
properties = { thought = { type = "string" } }

[[tools]]
name = "load_tools"
required = ["names"]
properties = { names = { type = "array", items = { type = "string" } } }

[[tools]]
name = "task"
required = ["agent", "prompt"]
properties = { agent = { type = "string" }, prompt = { type = "string" } }

[[tools]]
name = "ask_user"
required = ["question"]
properties = { question = { type = "string", minLength = 1, maxLength = 4096 } }

[[tools]]
name = "done"
required = []
[tools.properties]
[tools.properties.message]
type = "string"

[[tools]]
name = "list_functions"
required = []
properties = {}

[[tools]]
name = "get_function_details"
required = ["names"]
properties = { names = { type = "array", items = { type = "string" }, minItems = 1, uniqueItems = true } }

[[tools]]
name = "exec_cell"
required = ["source"]
properties = { source = { type = "string", minLength = 1, maxLength = 65536 } }
