[profile]
format_version = 1
canonical_version = "openai-v1"
name = "qwen38-27b"
family = "qwen3.8"
quant = "UD-Q4_K_XL"
inherits = "_base"
# Qwen3.8-27B text profile. Disable thinking through
# chat_template_thinking_off.jinja. Runtime overlays own serving and sampling.

[model]
context_size = 262144
chat_template = "chatml"
supports_tool_calls = true
supports_system_role = true
# The pinned llama-server template renders assistant content with generation
# prompt disabled and supports continuing that final message.
supports_prefill = true

[tokens]
method = "chars_div_4"
tokenizer = ""

[capacity]
preamble = ""
max_tools = 8
simplify_schemas = false

[normalize]
rules = []
modules = []

[denormalize]
rules = []
modules = ["behavioral.py"]

# Shared operational suffix.
[behavioral]
tool_call_style = "openai_json"
reminder_placement = "system"
# Shared operational suffix. Keep this identical across the Qwen reference
# and transfer profiles so profile adaptation does not change harness instructions.
suffix = """

## Operational rules

Constraints come from the task. These reminders do not add permissions or acceptance rules.

1. **Follow the task's completion criteria.** Use relevant checks; a passing command proves only what it checked.
2. **Inspect relevant source and tests before editing.**
3. **Respect the task's explicit edit restrictions**, including any restrictions on tests.
4. **Verify changes as the task requires.** Report checks performed and anything left unverified.
5. **Use actual pretest results when supplied.** Do not assume a pretest ran or that an earlier result covers later changes.
6. **Iterate, not rewrite.** Read the error. Make a targeted edit. Do not start over.
7. **No re-runs without intervening mutation.** Flag variations don't count.
8. **Sessions resume.** Continue from where you stopped. Do not restart.
9. **Batch independent reads.** You may emit multiple read/glob/grep calls in one turn; the harness runs them concurrently and returns all results together. One call per turn wastes context when you already know the set of files to inspect."""
